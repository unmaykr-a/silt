# Example Silt deployment.
#
# The socket proxy is not optional decoration. Mounting /var/run/docker.sock:ro
# into Silt directly would NOT be a security boundary: read-only applies to the
# file, not to the API, so anything holding it can still create privileged
# containers. The proxy enforces read-only at the HTTP verb level with POST=0,
# and it lets Silt run as a non-root user with no docker group membership.
#
# Silt never writes to the Docker API. POST=0 is the line you should not change.

services:
  silt:
    image: ghcr.io/unmaykr-a/silt:latest
    container_name: silt
    restart: unless-stopped
    environment:
      SILT_DOCKER_HOST: tcp://docker-socket-proxy:2375
      # SILT_LOG_LEVEL: debug
      # Extra environment keys to keep readable instead of redacting.
      # SILT_KEEP_KEYS: MY_APP_REGION,APP_*

      # Notifications. Any shoutrrr target: ntfy, Gotify, Discord, email.
      # Kinds and severity are ANDed.
      # SILT_NOTIFY_URLS: ntfy://ntfy.sh/my-silt-topic
      # SILT_NOTIFY_ON: image_id,image_digest,volumes,service_removed
      # SILT_NOTIFY_MIN_SEVERITY: medium
      # SILT_BASE_URL: https://silt.example.com

      # External events (Uptime Kuma, cron, Home Assistant). Unset, the
      # endpoint returns 503 rather than accepting anything.
      # SILT_INGEST_TOKEN: change-me

      # Authentication. Unset, Silt is open to anyone who can reach the port.
      # SILT_TRUST_PROXY_AUTH: "true"
      # SILT_AUTH_HEADER: X-Remote-User
      # SILT_PASSWORD_HASH: "$$2a$$12$$..."   # note the doubled $ for compose
    ports:
      - "8375:8375"
    volumes:
      # Silt runs as a non-root user (uid 65532). A named volume gets the
      # ownership right without any chown on the host.
      - silt-data:/data
    depends_on:
      - docker-socket-proxy
    networks:
      - silt

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: silt-socket-proxy
    restart: unless-stopped
    environment:
      # What Silt reads.
      CONTAINERS: 1 # list and inspect containers — discovery
      IMAGES: 1 # inspect images — resolving digests
      EVENTS: 1 # the event stream — change triggers
      # The Docker client negotiates an API version before it does anything
      # else. Without these two, every call fails with a confusing 403.
      VERSION: 1
      PING: 1
      # Everything else stays off. POST=0 is what makes this safe to run.
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - silt

volumes:
  silt-data:

networks:
  silt:
    driver: bridge
