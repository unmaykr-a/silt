# Example Silt deployment.
#
# The socket proxy is not optional decoration. Mounting /var/run/docker.sock:ro
# into Silt directly would NOT be a security boundary: read-only applies to the
# file, not to the API, so anything holding it can still create privileged
# containers. The proxy enforces read-only at the HTTP verb level with POST=0,
# and it lets Silt run as a non-root user with no docker group membership.
#
# Silt never writes to the Docker API. POST=0 is the line you should not change.

services:
  silt:
    image: ghcr.io/unmaykr-a/silt:latest
    container_name: silt
    restart: unless-stopped
    environment:
      SILT_DOCKER_HOST: tcp://docker-socket-proxy:2375
      # SILT_LOG_LEVEL: debug
    ports:
      - "8375:8375"
    depends_on:
      - docker-socket-proxy
    networks:
      - silt

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: silt-socket-proxy
    restart: unless-stopped
    environment:
      # What Silt reads.
      CONTAINERS: 1 # list and inspect containers — discovery
      IMAGES: 1 # inspect images — resolving digests
      EVENTS: 1 # the event stream — change triggers
      # The Docker client negotiates an API version before it does anything
      # else. Without these two, every call fails with a confusing 403.
      VERSION: 1
      PING: 1
      # Everything else stays off. POST=0 is what makes this safe to run.
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - silt

networks:
  silt:
    driver: bridge
