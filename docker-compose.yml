# Silt: a self-hosted change journal for Docker Compose stacks.
#
# Everything optional lives in .env — copy .env.example to .env and uncomment
# what you need. This file stays short enough to read.
#
# The socket proxy is not optional decoration. Mounting /var/run/docker.sock:ro
# into Silt directly would NOT be a security boundary: read-only applies to the
# file, not to the API, so anything holding it can still create privileged
# containers. The proxy enforces read-only at the HTTP verb level with POST=0,
# and it lets Silt run as a non-root user with no docker group membership.
#
# Silt never writes to the Docker API. POST=0 is the line you should not change.

services:
  silt:
    image: ghcr.io/unmaykr-a/silt:latest
    container_name: silt
    restart: unless-stopped
    environment:
      SILT_DOCKER_HOST: tcp://docker-socket-proxy:2375
    # Everything else. required:false so a missing .env is not an error —
    # Silt's defaults are a working install, and `cp .env.example .env` is
    # something you do when you want to change one.
    env_file:
      - path: .env
        required: false
    ports:
      - "${SILT_PORT:-8375}:8375"
    volumes:
      # Silt runs as a non-root user (uid 65532). A named volume gets the
      # ownership right without any chown on the host.
      - silt-data:/data
      # To diff the compose files themselves, mount the directories they live
      # in at the same path they have on the host, so the paths in Compose's
      # own labels resolve. Read-only: Silt never writes to them. Then set
      # SILT_COMPOSE_ROOTS in .env to the same paths.
      # - /srv:/srv:ro
      # - /opt:/opt:ro
    depends_on:
      - docker-socket-proxy
    networks:
      - silt

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: silt-socket-proxy
    restart: unless-stopped
    environment:
      # What Silt reads.
      CONTAINERS: 1 # list and inspect containers — discovery
      IMAGES: 1 # inspect images — resolving digests
      EVENTS: 1 # the event stream — change triggers
      # The Docker client negotiates an API version before it does anything
      # else. Without these two, every call fails with a confusing 403.
      VERSION: 1
      PING: 1
      # Everything else stays off. POST=0 is what makes this safe to run.
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - silt

volumes:
  silt-data:

networks:
  silt:
    driver: bridge
