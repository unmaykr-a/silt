name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# One publish at a time; a queued run for an older commit must not overwrite
# :latest with a stale image.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action's own version output is the branch name on a branch
      # push, which would make `silt --version` report "main". Resolve
      # something meaningful instead.
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Silt
            org.opencontainers.image.description=A self-hosted change journal for Docker Compose stacks
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: docker/build-push-action@v6
        with:
          context: .
          # linux/arm/v7 is a stated non-goal; see the README.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance attestations add "unknown/unknown" entries to the GHCR
          # package listing, which reads as a broken build to anyone browsing
          # it. Two platforms, nothing else.
          provenance: false

  # The GitHub release, published from the same changelog the repository's
  # CHANGELOG.md is generated from. Notes written separately are notes that
  # disagree with the changelog by the second release.
  #
  # Tags only: a push to main publishes an image, which is not a release.
  release:
    name: publish the release
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Render the notes
        id: notes
        run: |
          # Fails the job when the tag names a release the changelog does not
          # have, which is the shape of every "tagged the wrong thing" mistake.
          go run ./internal/changelog/cmd/gen --notes "${{ github.ref_name }}" > notes.md
          echo "--- notes for ${{ github.ref_name }} ---"
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Silt ${{ github.ref_name }}" \
            --notes-file notes.md \
            --verify-tag
          gh release view "${{ github.ref_name }}" --json url --jq .url
