name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# One publish at a time; a queued run for an older commit must not overwrite
# :latest with a stale image.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action's own version output is the branch name on a branch
      # push, which would make `silt --version` report "main". Resolve
      # something meaningful instead.
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Silt
            org.opencontainers.image.description=A self-hosted change journal for Docker Compose stacks
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: docker/build-push-action@v6
        with:
          context: .
          # linux/arm/v7 is a stated non-goal; see the README.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance attestations add "unknown/unknown" entries to the GHCR
          # package listing, which reads as a broken build to anyone browsing
          # it. Two platforms, nothing else.
          provenance: false

  # The GitHub release, published from the same changelog the repository's
  # CHANGELOG.md is generated from. Notes written separately are notes that
  # disagree with the changelog by the second release.
  #
  # Triggered by the merge, not by a tag. Tagging by hand is a step that gets
  # forgotten — it was, for fifteen releases — and it is a step that needs a
  # working git remote from wherever the release is being cut. The changelog
  # already names the version; if a release for it does not exist yet, this
  # creates the tag and publishes it. Merging a version bump is the whole
  # ceremony.
  #
  # Idempotent on purpose: every push to main runs this, and all but the one
  # that bumped the version find the release already there and stop.
  release:
    name: publish the release
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so an existing release is visible rather than being
          # published a second time.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Resolve the version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="v$(go run ./internal/changelog/cmd/gen --version)"
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "resolved $version"

      - name: Has it already been published?
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} is already released; nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render the notes
        if: steps.existing.outputs.published == 'false'
        run: |
          # Fails the job when the version names a release the changelog does
          # not have, which is the shape of every "tagged the wrong thing"
          # mistake.
          go run ./internal/changelog/cmd/gen --notes "${{ steps.version.outputs.tag }}" > notes.md
          echo "--- notes for ${{ steps.version.outputs.tag }} ---"
          cat notes.md

      - name: Publish
        if: steps.existing.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target creates the tag at this commit when it does not exist, so
          # there is no separate tag push to get wrong or to be blocked.
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "Silt ${{ steps.version.outputs.tag }}" \
            --notes-file notes.md
          gh release view "${{ steps.version.outputs.tag }}" --json url --jq .url
