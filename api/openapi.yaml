openapi: 3.1.0
info:
  title: Silt API
  version: 0.1.0
  description: |
    A self-hosted change journal for Docker Compose stacks.

    This document is hand-maintained: there is no OpenAPI generator for stdlib
    net/http handlers, and adding one is not worth a dependency at this size.
    It is the contract, not a description of one — `openapi-typescript`
    generates the frontend types from it, and a Go contract test asserts the
    handlers still match, so drift fails CI instead of surfacing in a browser.

    All timestamps are Unix milliseconds in UTC.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /

tags:
  - name: hosts
  - name: projects
  - name: snapshots
  - name: events
  - name: system

paths:
  /api/hosts:
    get:
      tags: [hosts]
      summary: List Docker hosts
      operationId: listHosts
      responses:
        "200":
          description: Hosts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Host" }

  /api/projects:
    get:
      tags: [projects]
      summary: List Compose projects
      operationId: listProjects
      parameters:
        - name: host
          in: query
          description: Host id. Defaults to the only host on a single-host install.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }

  /api/projects/{id}:
    get:
      tags: [projects]
      summary: Get one project
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{id}/snapshots:
    get:
      tags: [snapshots]
      summary: List a project's snapshots, newest first
      operationId: listSnapshots
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: before
          in: query
          description: Only snapshots taken before this timestamp.
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
        - name: changed_only
          in: query
          description: Only snapshots where the configuration changed.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Snapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/projects/{id}/services:
    get:
      tags: [projects]
      summary: Service names seen in a project
      operationId: listProjectServices
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Service names
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/projects/{id}/services/{service}:
    get:
      tags: [projects]
      summary: One service's history
      description: |
        Image identity, state and restart counts over time, plus the points at
        which each environment key's value changed. Environment values are
        keyed digests unless the key is on the cleartext keep-list, so this
        answers "when did SECRET_KEY change?" without ever holding the secret.
      operationId: getServiceHistory
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: service
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 200, maximum: 1000 }
      responses:
        "200":
          description: Service history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceHistory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{id}/snapshot:
    post:
      tags: [snapshots]
      summary: Take a snapshot now
      operationId: takeSnapshot
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "202":
          description: Snapshot taken
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: The snapshot could not be taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The collector is not running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/snapshots/{id}:
    get:
      tags: [snapshots]
      summary: Get one snapshot with its service states
      operationId: getSnapshot
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/snapshots/{id}/compose:
    get:
      tags: [snapshots]
      summary: The effective, redacted project model for a snapshot
      description: |
        A record of what ran, with secret values already replaced by keyed
        digests. It is not a file to re-apply.
      operationId: getCompose
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: format
          in: query
          schema: { type: string, enum: [json, yaml], default: json }
      responses:
        "200":
          description: Project model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectModel" }
            application/yaml:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/snapshots/{id}/files:
    get:
      tags: [snapshots]
      summary: Compose files captured in a snapshot
      operationId: listSnapshotFiles
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Captured files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ComposeFile" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/snapshots/{id}/file:
    get:
      tags: [snapshots]
      summary: The redacted text of one captured file
      description: |
        Line structure is preserved exactly; only values are replaced, so line
        numbers and surrounding context match the file as written.
      operationId: getSnapshotFile
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/diff/file:
    get:
      tags: [snapshots]
      summary: Line-by-line diff of one file between two snapshots
      description: |
        Answers "which line changed", which the structured diff cannot: that
        reports an environment key moved, not where in the file it lives.
        A file absent from one side diffs against empty, rendering a creation
        or deletion rather than an error.
      operationId: getFileDiff
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: to
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: context
          in: query
          description: Unchanged lines around each hunk, or `full` for the whole file.
          schema: { type: string, default: "3" }
      responses:
        "200":
          description: File diff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDiff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{id}/files:
    get:
      tags: [projects]
      summary: Every file path this project has captured
      operationId: listProjectFilePaths
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: File paths
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/projects/{id}/files/preview:
    get:
      tags: [projects]
      summary: Live preview of a file for marking
      description: |
        Reads the file fresh from disk, applies the redaction a capture would
        apply, and stores nothing. The marking UI works from this because a
        stored capture is already redacted and would leave nothing to decide
        about. Only paths this project has referenced can be previewed.
      operationId: previewFile
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Preview lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: No compose roots configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/projects/{id}/redaction-rules:
    get:
      tags: [projects]
      summary: Manual redaction decisions for a project
      operationId: listRedactionRules
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RedactionRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [projects]
      summary: Hide or reveal a value
      description: |
        Applied at capture time, before anything is written, so a hidden value
        is never stored rather than stored and later concealed. Revealing
        affects only future captures: earlier snapshots hold a digest, not the
        value. Adding a rule clears any opposing rule for the same target.
      operationId: createRedactionRule
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedactionRuleRequest" }
      responses:
        "201":
          description: Rule stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedactionRule" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/projects/{id}/redaction-rules/{rule}:
    delete:
      tags: [projects]
      summary: Remove a manual redaction decision
      operationId: deleteRedactionRule
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: rule
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204":
          description: Removed
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/diff:
    get:
      tags: [snapshots]
      summary: Structural diff between two snapshots
      operationId: getDiff
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: to
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Diff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/events:
    get:
      tags: [events]
      summary: List events, newest first
      operationId: listEvents
      parameters:
        - name: from
          in: query
          schema: { type: integer, format: int64 }
        - name: to
          in: query
          schema: { type: integer, format: int64 }
        - name: project
          in: query
          schema: { type: integer, format: int64 }
        - name: service
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { type: string, enum: [info, warn, error] }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 1000 }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }

  /api/timeline:
    get:
      tags: [events]
      summary: Change markers and events merged onto one axis
      operationId: getTimeline
      parameters:
        - name: from
          in: query
          schema: { type: integer, format: int64 }
        - name: to
          in: query
          schema: { type: integer, format: int64 }
        - name: project
          in: query
          schema: { type: integer, format: int64 }
        - name: bucket
          in: query
          description: |
            Bucket width as a Go duration (`5m`, `1h`). Clamped server-side so
            no request can ask for an unbounded number of buckets.
          schema: { type: string }
      responses:
        "200":
          description: Timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timeline" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/stream:
    get:
      tags: [events]
      summary: Server-sent event stream
      description: |
        Emits a `ready` event on connect, then `event` and `snapshot.changed`
        as they occur, with a comment heartbeat every 20 seconds.

        Behind nginx or Nginx Proxy Manager set `proxy_buffering off;` on the
        location, or events arrive in batches minutes late.
      operationId: stream
      responses:
        "200":
          description: An event stream
          content:
            text/event-stream:
              schema: { type: string }

  /api/ingest:
    post:
      tags: [events]
      summary: Generic external event webhook
      description: |
        Accepts a loose body so Uptime Kuma, a cron `curl` and a Home Assistant
        automation all work without a custom integration. Authenticate with
        `Authorization: Bearer <token>` or `?token=`; not every webhook source
        can set headers. Returns 503 when `SILT_INGEST_TOKEN` is unset — an
        unconfigured endpoint is closed, not open.
      operationId: ingest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestRequest" }
      responses:
        "202":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Body too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Ingest is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth:
    get:
      tags: [system]
      summary: Whether authentication is required and satisfied
      description: |
        Lets the UI decide whether to render a login form. Never returns the
        password hash or any credential.
      operationId: getAuthState
      responses:
        "200":
          description: Auth state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthState" }

  /api/login:
    post:
      tags: [system]
      summary: Exchange the configured password for a session cookie
      description: |
        The fallback for installs without an identity provider. Where a reverse
        proxy asserts identity via `SILT_TRUST_PROXY_AUTH`, this is not needed.
        Returns 503 when no password is configured.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: Authenticated; a session cookie is set
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Incorrect password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Password login is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/logout:
    post:
      tags: [system]
      summary: Clear the session cookie
      operationId: logout
      responses:
        "200":
          description: Session cleared
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated: { type: boolean }

  /api/settings:
    get:
      tags: [system]
      summary: Effective configuration, read-only
      description: |
        Silt is configured by environment variables, so this reports what is in
        force rather than offering to change it. Secrets are reported as
        set-or-not and never echoed.
      operationId: getSettings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }

  /api/maintenance/prune:
    post:
      tags: [system]
      summary: Run a retention pass now
      description: |
        Uses the configured retention policy. The caller cannot supply its own
        window: an endpoint that accepted one would be a delete endpoint
        wearing a different name.
      operationId: prune
      responses:
        "200":
          description: What the pass removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PruneResult" }

  /healthz:
    get:
      tags: [system]
      summary: Liveness
      operationId: healthz
      responses:
        "200":
          description: The process is up
          content:
            text/plain:
              schema: { type: string }

  /readyz:
    get:
      tags: [system]
      summary: Readiness
      description: Reports whether the database answers, not just that the process is up.
      operationId: readyz
      responses:
        "200":
          description: Ready
          content:
            text/plain:
              schema: { type: string }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /metrics:
    get:
      tags: [system]
      summary: Prometheus exposition
      operationId: metrics
      responses:
        "200":
          description: Metrics
          content:
            text/plain:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Host:
      type: object
      required: [id, name, endpoint]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        endpoint: { type: string }
        docker_version: { type: string }
        last_seen_at: { type: integer, format: int64 }

    Project:
      type: object
      required: [id, host_id, name, config_files, first_seen_at, last_seen_at, archived]
      properties:
        id: { type: integer, format: int64 }
        host_id: { type: integer, format: int64 }
        name: { type: string }
        working_dir: { type: string }
        config_files:
          type: array
          items: { type: string }
        first_seen_at: { type: integer, format: int64 }
        last_seen_at: { type: integer, format: int64 }
        archived: { type: boolean }

    Snapshot:
      type: object
      required:
        [id, project_id, taken_at, last_observed_at, observation_count,
         trigger, compose_source, config_changed, runtime_changed]
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        taken_at: { type: integer, format: int64 }
        last_observed_at:
          type: integer
          format: int64
          description: |
            An observation identical to this snapshot updates this instead of
            inserting a row.
        observation_count: { type: integer, format: int64 }
        trigger: { type: string, enum: [event, file, interval, manual] }
        compose_source: { type: string, enum: [containers, files, unavailable] }
        config_changed:
          type: boolean
          description: |
            False means runtime changed but configuration did not — a restart
            or health transition.
        runtime_changed: { type: boolean }

    ServiceState:
      type: object
      required: [service, restart_count]
      properties:
        service: { type: string }
        container_id: { type: string }
        container_name: { type: string }
        image_ref: { type: string }
        image_id:
          type: string
          description: Local image ID. Always present; this is the fingerprinted identity.
        image_digest:
          type: string
          description: Registry digest. Empty for locally-built images.
        state: { type: string }
        health: { type: string }
        restart_count: { type: integer, format: int64 }
        started_at: { type: integer, format: int64 }

    SnapshotDetail:
      allOf:
        - $ref: "#/components/schemas/Snapshot"
        - type: object
          required: [services]
          properties:
            services:
              type: array
              items: { $ref: "#/components/schemas/ServiceState" }

    ProjectModel:
      type: object
      required: [name, source, services]
      properties:
        name: { type: string }
        working_dir: { type: string }
        config_files:
          type: array
          items: { type: string }
        source: { type: string, enum: [containers, files, unavailable] }
        services:
          type: object
          additionalProperties: { type: object }

    Change:
      type: object
      required: [kind, path, op, severity]
      properties:
        kind:
          type: string
          enum:
            [image_ref, image_id, image_digest, env, ports, volumes, networks,
             healthcheck, resources, command, entrypoint, restart_policy,
             labels, depends_on, service_added, service_removed, state, other]
        service: { type: string }
        path: { type: string }
        op: { type: string, enum: [add, remove, replace] }
        before:
          type: string
          description: |
            For a redacted value this is a keyed digest placeholder, never the
            value itself.
        after: { type: string }
        severity: { type: string, enum: [high, medium, low] }

    DiffSide:
      type: object
      required: [id, taken_at]
      properties:
        id: { type: integer, format: int64 }
        taken_at: { type: integer, format: int64 }

    Diff:
      type: object
      required: [from, to, summary, changes]
      properties:
        from: { $ref: "#/components/schemas/DiffSide" }
        to: { $ref: "#/components/schemas/DiffSide" }
        summary:
          type: object
          additionalProperties: { type: integer }
        changes:
          type: array
          items: { $ref: "#/components/schemas/Change" }

    Event:
      type: object
      required: [id, ts, source, type, severity]
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        service: { type: string }
        ts: { type: integer, format: int64 }
        source: { type: string, enum: [docker, silt, webhook] }
        type: { type: string }
        severity: { type: string, enum: [info, warn, error] }
        actor: { type: string }
        message: { type: string }
        payload: {}

    TimelineBucket:
      type: object
      required: [start, changes, events, errors]
      properties:
        start: { type: integer, format: int64 }
        changes: { type: integer }
        events: { type: integer }
        errors: { type: integer }

    Timeline:
      type: object
      required: [from, to, bucket_ms, buckets, changes, events]
      properties:
        from: { type: integer, format: int64 }
        to: { type: integer, format: int64 }
        bucket_ms: { type: integer, format: int64 }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/TimelineBucket" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/Snapshot" }
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }

    ServiceObservation:
      type: object
      required: [snapshot_id, taken_at, config_changed, restart_count]
      properties:
        snapshot_id: { type: integer, format: int64 }
        taken_at: { type: integer, format: int64 }
        config_changed: { type: boolean }
        image_ref: { type: string }
        image_id: { type: string }
        image_digest: { type: string }
        state: { type: string }
        health: { type: string }
        restart_count: { type: integer, format: int64 }

    EnvKeyChange:
      type: object
      required: [key, taken_at, redacted, digest, value_len_bucket, first_seen]
      properties:
        key: { type: string }
        taken_at: { type: integer, format: int64 }
        redacted: { type: boolean }
        digest:
          type: string
          description: Keyed digest of the value, comparable only within this install.
        value_len_bucket: { type: string, enum: [empty, short, medium, long] }
        value:
          type: string
          description: Present only when the key is on the cleartext keep-list.
        first_seen: { type: boolean }

    ServiceHistory:
      type: object
      required: [project_id, service, observations, env_changes]
      properties:
        project_id: { type: integer, format: int64 }
        service: { type: string }
        observations:
          type: array
          items: { $ref: "#/components/schemas/ServiceObservation" }
        env_changes:
          type: array
          items: { $ref: "#/components/schemas/EnvKeyChange" }

    Settings:
      type: object
      required:
        [version, host_name, docker_host, db_path, snapshot_interval_ms,
         retention_days, unchanged_retention_days, event_retention_days,
         retention_interval_ms, vacuum_interval_ms, keep_keys,
         ingest_configured, log_level, usage]
      properties:
        version: { type: string }
        host_name: { type: string }
        docker_host: { type: string }
        db_path: { type: string }
        snapshot_interval_ms: { type: integer, format: int64 }
        retention_days: { type: integer }
        unchanged_retention_days: { type: integer }
        event_retention_days: { type: integer }
        retention_interval_ms: { type: integer, format: int64 }
        vacuum_interval_ms: { type: integer, format: int64 }
        keep_keys:
          type: array
          items: { type: string }
        ingest_configured:
          type: boolean
          description: Whether SILT_INGEST_TOKEN is set. The token itself is never returned.
        log_level: { type: string }
        usage:
          type: object
          required: [blobs, stored_bytes, uncompressed_bytes, events]
          properties:
            blobs: { type: integer, format: int64 }
            stored_bytes: { type: integer, format: int64 }
            uncompressed_bytes: { type: integer, format: int64 }
            events: { type: integer, format: int64 }

    AuthState:
      type: object
      required: [required, password_enabled, authenticated]
      properties:
        required:
          type: boolean
          description: Whether any authentication is configured at all.
        password_enabled: { type: boolean }
        authenticated: { type: boolean }

    PruneResult:
      type: object
      required: [unchanged_snapshots, changed_snapshots, events, blobs]
      properties:
        unchanged_snapshots: { type: integer, format: int64 }
        changed_snapshots: { type: integer, format: int64 }
        events: { type: integer, format: int64 }
        blobs: { type: integer, format: int64 }

    ComposeFile:
      type: object
      required: [path, status, line_count, size]
      properties:
        path: { type: string }
        status:
          type: string
          enum: [ok, unreadable, outside_roots, too_large]
        line_count: { type: integer, format: int64 }
        size: { type: integer, format: int64 }
        content_hash:
          type: string
          description: |
            Content address of the redacted text. Comparing it across two
            snapshots tells you which files differ without fetching their text.

    FileContent:
      type: object
      required: [path, status, content]
      properties:
        path: { type: string }
        status: { type: string }
        content:
          type: string
          description: Redacted text with line structure preserved exactly.

    DiffLine:
      type: object
      required: [op, old_number, new_number, text]
      properties:
        op: { type: string, enum: [equal, insert, delete] }
        old_number:
          type: integer
          description: Line number in the "before" text, 0 if the line is new.
        new_number:
          type: integer
          description: Line number in the "after" text, 0 if the line was removed.
        text: { type: string }

    DiffHunk:
      type: object
      required: [old_start, old_count, new_start, new_count, lines]
      properties:
        old_start: { type: integer }
        old_count: { type: integer }
        new_start: { type: integer }
        new_count: { type: integer }
        lines:
          type: array
          items: { $ref: "#/components/schemas/DiffLine" }

    FileDiff:
      type: object
      required: [path, from, to, status, diff]
      properties:
        path: { type: string }
        from: { $ref: "#/components/schemas/DiffSide" }
        to: { $ref: "#/components/schemas/DiffSide" }
        status: { type: string }
        diff:
          type: object
          required: [hunks, added, removed, identical]
          properties:
            hunks:
              type: array
              items: { $ref: "#/components/schemas/DiffHunk" }
            added: { type: integer }
            removed: { type: integer }
            identical: { type: boolean }

    PreviewLine:
      type: object
      required: [number, text, redacted, reason, markable]
      properties:
        number: { type: integer }
        text: { type: string }
        key:
          type: string
          description: The assignment key, when the line has one. Rules keyed on it survive edits.
        redacted: { type: boolean }
        reason:
          type: string
          enum: [structure, interpolation, keep_list, default, rule_hide, rule_reveal]
        markable:
          type: boolean
          description: False for lines with no value to decide about.

    FilePreview:
      type: object
      required: [path, status, lines]
      properties:
        path: { type: string }
        status: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PreviewLine" }

    RedactionRule:
      type: object
      required: [id, path, action, kind]
      properties:
        id: { type: integer, format: int64 }
        path:
          type: string
          description: Empty means the rule applies to every file in the project.
        action: { type: string, enum: [hide, reveal] }
        kind: { type: string, enum: [key, line] }
        key: { type: string }
        line_no: { type: integer, format: int64 }
        note: { type: string }

    RedactionRuleRequest:
      type: object
      required: [action, kind]
      properties:
        path: { type: string }
        action: { type: string, enum: [hide, reveal] }
        kind: { type: string, enum: [key, line] }
        key: { type: string }
        line_no: { type: integer, format: int64 }
        note: { type: string }

    IngestRequest:
      type: object
      required: [type]
      properties:
        type: { type: string }
        project: { type: string }
        service: { type: string }
        severity: { type: string, enum: [info, warn, error] }
        message: { type: string }
        actor: { type: string }
        ts: { type: integer, format: int64 }
